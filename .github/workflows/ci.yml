name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: V 0.2.0/package-lock.json
      - run: npm ci
        working-directory: "V 0.2.0"
      - run: npm run typecheck
        working-directory: "V 0.2.0"
      - run: npm run lint
        working-directory: "V 0.2.0"
