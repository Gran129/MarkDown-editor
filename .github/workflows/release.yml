name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: V 0.2.0/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "V 0.2.0/src-tauri"

      - name: Install frontend dependencies
        working-directory: "V 0.2.0"
        run: npm ci

      - name: Build Tauri NSIS installer
        working-directory: "V 0.2.0"
        run: npm run tauri build
        env:
          CI: true

      - name: Collect artifacts into releases/
        shell: pwsh
        run: |
          Set-Location "V 0.2.0"
          ./scripts/collect-windows-release.ps1

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-releases
          path: |
            releases/MarkDown-editor_*.exe
            releases/MarkDown-editor.portable
            releases/INSTALL.zh-CN.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            releases/MarkDown-editor_*.exe
            releases/MarkDown-editor.portable
            releases/INSTALL.zh-CN.txt
          body: |
            Windows 安装包（v0.2.7）

            - **安装包联网版**：`MarkDown-editor_0.2.7_x64-setup.exe` — 双击安装到电脑
            - **便携版本地版**：`MarkDown-editor_0.2.7_portable.exe` — 免安装，可离线使用

            ### 本版更新（基于 v0.2.6）
            - 设置分为「常规 / 编辑」；代码块支持段落内行内代码、多段落合并为一个代码块
            - 修复分栏拖动手柄滚动导致页面错位，以及 Mermaid 11 全局 Syntax error 横幅
            - Mermaid 代码块锁定语言，并在每次输入后实时预览（语法不完整时保留上一张正确图）
            - 支持 PDF / XMind 预览与编辑；与 Office 共用导入按钮；可新建并原生编辑 XMind
            - 打开非 Markdown 文件时关闭语法视窗；阅读=预览，编辑=原生编辑并保存
            - 左侧栏新增可调高度的资源栏（笔记隐藏 .resources），支持拖入、拖到正文插入预览与定位
            - 文件预览块高亮选中、插入前提示、移除/上下移动/展开收起
            - 有序列表：Enter 新建下一项；开头 Backspace 去掉序号并并入上一项；再按一次退出列表

            安装说明见 `INSTALL.zh-CN.txt`。需要 Windows 10/11 64 位与 WebView2。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
