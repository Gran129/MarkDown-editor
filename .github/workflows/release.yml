name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: V 0.2.0/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "V 0.2.0/src-tauri"

      - name: Install frontend dependencies
        working-directory: "V 0.2.0"
        run: npm ci

      - name: Build Tauri NSIS installer
        working-directory: "V 0.2.0"
        run: npm run tauri build
        env:
          CI: true

      - name: Collect artifacts into releases/
        shell: pwsh
        run: |
          Set-Location "V 0.2.0"
          ./scripts/collect-windows-release.ps1

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-releases
          path: |
            releases/MarkDown-editor_*.exe
            releases/MarkDown-editor.portable
            releases/INSTALL.zh-CN.txt
          if-no-files-found: error

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v',''
          $notes = @(
            "Windows 安装包（v$ver）",
            "",
            "- **安装包联网版**：``MarkDown-editor_${ver}_x64-setup.exe`` — 双击安装到电脑",
            "- **便携版本地版**：``MarkDown-editor_${ver}_portable.exe`` — 免安装，可离线使用",
            ""
          )
          $changelog = "CHANGELOG.md"
          if (Test-Path $changelog) {
            $notes += "### 版本说明", ""
            $notes += Get-Content $changelog
            $notes += ""
          }
          $notes += "安装说明见 ``INSTALL.zh-CN.txt``。需要 Windows 10/11 64 位与 WebView2。"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: release-notes.md
          files: |
            releases/MarkDown-editor_*.exe
            releases/MarkDown-editor.portable
            releases/INSTALL.zh-CN.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
